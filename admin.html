<style>
/* Layout: an operations console for one recruiter. Sidebar of queues, a scannable list, and a
   slide-over record where screening happens. Same field-terminal identity as the public site. */
:root{
  --bg:#0e1012; --surface:#14171a; --raise:#1a1e22; --line:#262b30; --line-2:#343a42;
  --fg:#e9e4d8; --muted:#a19d92; --dim:#6e6c66;
  --amber:#e8b65a; --logo:var(--logo-on-dark); --sage:#8cc29b; --sky:#89b6da; --rose:#e3927f; --violet:#bba6e6; --sand:#d8c39a;
  --display:"Martian Mono", "IBM Plex Mono", ui-monospace, monospace;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f1; --surface:#ffffff; --raise:#f7f8f5; --line:#dadfd8; --line-2:#c3c9c1;
    --fg:#15191c; --muted:#545a5d; --dim:#80868a;
    --amber:#9a6200; --logo:var(--logo-on-light); --sage:#2c7445; --sky:#2a6694; --rose:#a8452c; --violet:#6a4cae; --sand:#7a5f2b;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f1; --surface:#ffffff; --raise:#f7f8f5; --line:#dadfd8; --line-2:#c3c9c1;
    --fg:#15191c; --muted:#545a5d; --dim:#80868a;
    --amber:#9a6200; --logo:var(--logo-on-light); --sage:#2c7445; --sky:#2a6694; --rose:#a8452c; --violet:#6a4cae; --sand:#7a5f2b;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .muted{color:var(--muted)}

/* logo */
.logo{display:inline-flex;align-items:center;gap:.5em;text-decoration:none;color:var(--fg);line-height:1}
.logo .mark{width:2em;height:2em;flex:none;overflow:visible}
.logo .word{display:grid;gap:.3em}
.logo .word b{font-family:var(--display);font-weight:700;letter-spacing:-.045em;white-space:nowrap}
.logo .sub{display:flex;align-items:center;gap:.7em;font-family:var(--mono);font-weight:600;font-size:.4em;letter-spacing:.5em;color:var(--amber);text-transform:uppercase}
.logo .sub i{font-style:normal;margin-right:-.5em}
.logo .sub::before,.logo .sub::after{content:"";flex:1;height:1.5px;min-width:.8em;background:currentColor;opacity:.75}
/* The Match lockup: block-and-dot mark + one-line mono wordmark, "Recruit" in the accent */
.logo{gap:.45em}
.logo .mark{width:1.6em;height:1.6em}
.logo .word{display:flex;align-items:baseline;gap:.32em}
.logo .word b{font-family:var(--display);font-weight:700;letter-spacing:-.04em;color:var(--fg)}
.logo .sub{display:inline;font-family:var(--display);font-weight:700;font-size:1em;letter-spacing:-.04em;text-transform:none;color:var(--amber);white-space:nowrap}
.logo .sub i{margin-right:0}
.logo .sub::before,.logo .sub::after{content:none}

.logo-img{display:block;height:2.5em;aspect-ratio:760 / 279;background:var(--logo) no-repeat left center / contain}


/* buttons, inputs, pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--mono);font-size:12.5px;padding:8px 13px;border-radius:3px;border:1px solid var(--line-2);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--bg);font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--amber) 85%,var(--fg))}
.btn.danger{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 50%,transparent)}
.btn.danger.solid{background:var(--rose);color:var(--bg);border-color:var(--rose)}
.btn.small{padding:5px 9px;font-size:11.5px}
.btn.ghost{border-color:transparent;color:var(--dim)}.btn.ghost:hover{color:var(--fg);border-color:var(--line-2)}
.btn[disabled]{opacity:.5;cursor:progress}
.icon-btn{background:none;border:1px solid var(--line-2);border-radius:3px;width:32px;height:32px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--fg);border-color:var(--fg)}
.field{display:grid;gap:5px;min-width:0}
.field > span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.field small{color:var(--dim);font-size:12px}
.inp{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line-2);border-radius:3px;padding:8px 10px;font-size:14px}
.inp:focus{border-color:var(--amber);outline:none}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
select.inp{cursor:pointer}
.al-areas-sum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.al-areas-sum .chip{cursor:pointer;background:none}
.al-areas-sum .chip em{font-style:normal;color:var(--amber);margin-left:4px}
.al-areas-sum .chip.on{border-color:var(--amber);color:var(--fg)}
.chips-sm{display:flex;flex-wrap:wrap;gap:4px}
.chips-sm .chip{font-size:10.5px;padding:3px 6px}
.muted-row td{opacity:.55}
.row-acts{white-space:nowrap;text-align:right}
.row-acts .btn + .btn{margin-left:6px}
.al-pick{display:grid;gap:2px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:4px;padding:6px;margin:4px 0 10px}
.al-pick label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center;padding:6px 8px;border-radius:3px;cursor:pointer}
.al-pick label:hover{background:var(--raise)}
.al-pick small{grid-column:2;color:var(--dim);font-size:12px}
.al-pick .mono{font-size:13px;overflow-wrap:anywhere}
.tag-c{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:10px;line-height:1;padding:3px 5px;border-radius:3px;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);vertical-align:2px}
.pill{--c:var(--dim);display:inline-block;font-family:var(--mono);font-size:11px;line-height:1;padding:5px 7px;border-radius:3px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);white-space:nowrap}
.t-sky{--c:var(--sky)}.t-violet{--c:var(--violet)}.t-amber{--c:var(--amber)}.t-sage{--c:var(--sage)}.t-rose{--c:var(--rose)}.t-sand{--c:var(--sand)}.t-dim{--c:var(--dim)}
.score{font-family:var(--mono);font-weight:600;font-size:12px;padding:4px 7px;border-radius:3px;font-variant-numeric:tabular-nums}
.s-hi{color:var(--bg);background:var(--sage)} .s-mid{color:var(--bg);background:var(--amber)} .s-lo{color:var(--bg);background:var(--rose)} .s-none{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11.5px;padding:4px 7px;border:1px solid var(--line-2);border-radius:3px;color:var(--muted)}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:380px;display:grid;gap:18px}
.login-card .logo{font-size:20px;margin-bottom:6px}
.login-card form{display:grid;gap:14px;border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:22px}
.login-card .prompt{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:0}
.login-card .prompt::before{content:"$ ";color:var(--amber)}
.msg{font-size:13.5px;border-radius:3px;padding:10px 12px;border:1px solid var(--line-2);color:var(--muted)}
.msg.err{border-color:color-mix(in srgb,var(--rose) 50%,transparent);color:var(--rose)}

/* ================= CV reading ================= */
const LIBS = {
  pdf:'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
  pdfWorker:'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  mammoth:'https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js'
};
const loaded = {};
function loadScript(src){
  if(!loaded[src]) loaded[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('Could not load the CV reader. Check your internet connection.')); }; document.head.appendChild(s); });
  return loaded[src];
}
async function extractText(blob, name){
  const ext = extOf(name);
  if(ext === 'txt') return await blob.text();
  if(ext === 'pdf'){
    await loadScript(LIBS.pdf);
    const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
    const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    let out = '';
    for(let i = 1; i <= Math.min(pdf.numPages, 30); i++){
      const page = await pdf.getPage(i); const tc = await page.getTextContent();
      out += tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('') + '\n\n';
    }
    return out;
  }
  if(ext === 'docx'){
    await loadScript(LIBS.mammoth);
    const r = await window.mammoth.extractRawText({ arrayBuffer: await blob.arrayBuffer() });
    return r.value;
  }
  throw new Error('Older .doc files can’t be read automatically. Open the CV, save it as PDF or .docx, and add it again.');
}
async function ensureCvText(c){
  if(c.cv_text) return c.cv_text;
  if(!c.cv_path) throw new Error('This candidate has no CV file.');
  const blob = await db.fileBlob(c.cv_path);
  const text = (await extractText(blob, c.cv_filename || c.cv_path)).replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  if(text.length < 40) throw new Error('No readable text found. The CV may be a scanned image; open it and screen it by eye.');
  const row = await db.update('candidates', c.id, { cv_text: text.slice(0, 200000) });
  put('cands', row);
  return row.cv_text;
}

/* ================= scorecard ================= */
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function variants(term){
  const t = term.toLowerCase().trim();
  const g = SYN.find(grp => grp.includes(t));
  return g ? g : [t];
}
function findTerm(text, lower, vs){
  for(const v of vs){
    const re = new RegExp('(^|[^a-z0-9])' + esc(v.trim()) + '($|[^a-z0-9])', 'i');
    const m = re.exec(lower);
    if(m){
      const at = m.index + m[1].length;
      const a = Math.max(0, at - 60), b = Math.min(text.length, at + v.length + 60);
      return { found:true, via:v, snippet:(a > 0 ? '…' : '') + text.slice(a, b).replace(/\s+/g, ' ').trim() + (b < text.length ? '…' : '') };
    }
  }
  return { found:false };
}
function yearsFromForm(v){ const m = String(v || '').match(/\d+/); return m ? +m[0] : null; }
function yearsFromText(lower){
  let stated = null;
  const re = /(\d{1,2})\s*\+?\s*(?:years|yrs)/g; let m;
  while((m = re.exec(lower))){ const n = +m[1]; if(n > 0 && n <= 45) stated = Math.max(stated || 0, n); }
  const cur = new Date().getFullYear();
  const rr = /((?:19|20)\d{2})\s*(?:-|–|—|to)\s*((?:19|20)\d{2}|present|current|now|date|today)/g;
  const spans = [];
  while((m = rr.exec(lower))){ const s = +m[1]; const e = /\d/.test(m[2]) ? +m[2] : cur; if(e >= s && s >= 1970 && e <= cur + 1) spans.push([s, e]); }
  let fromDates = null;
  if(spans.length){
    spans.sort((a, b) => a[0] - b[0]);
    let total = 0, [cs, ce] = spans[0];
    for(const [s, e] of spans.slice(1)){ if(s <= ce){ ce = Math.max(ce, e); } else { total += ce - cs; cs = s; ce = e; } }
    total += ce - cs; fromDates = Math.min(45, total);
  }
  return { stated, fromDates };
}
function screen(text, role, cand){
  const lower = text.toLowerCase();
  const res = { role_id: role ? role.id : null, role_title: role ? role.title : null, run_at:new Date().toISOString(), parts:[], must:[], nice:[], flags:[] };
  res.donors = DONORS.filter(([, vs]) => findTerm(text, lower, vs).found).map(([n]) => n);
  res.languages = LANGS.filter(l => new RegExp('(^|[^a-z])' + l.toLowerCase() + '($|[^a-z])').test(lower));
  res.sectors = Object.entries(SECTORS).map(([s, kws]) => [s, kws.filter(k => lower.includes(k)).length]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const y = yearsFromText(lower), formY = yearsFromForm(cand && cand.years_experience);
  res.years = { stated:y.stated, fromDates:y.fromDates, form:formY };
  const est = Math.max(y.stated || 0, y.fromDates || 0) || formY || null;
  res.years.estimate = est;
  if(text.length < 600) res.flags.push('The CV text is very short. It may be a scanned image or incomplete.');
  if(est == null) res.flags.push('Years of experience could not be found in the CV.');
  if(!role){ res.score = null; return res; }

  const parts = [];
  if(role.must_have && role.must_have.length){
    res.must = role.must_have.map(t => Object.assign({ term:t }, findTerm(text, lower, variants(t))));
    parts.push(['Must-haves', 45, res.must.filter(x => x.found).length / res.must.length, `${res.must.filter(x => x.found).length}/${res.must.length}`]);
  }
  if(role.min_years){
    parts.push(['Experience', 20, est ? Math.min(1, est / role.min_years) : 0, `${est == null ? '?' : est} / ${role.min_years} yrs`]);
    if(est != null && est < role.min_years) res.flags.push(`About ${est} years found; the role asks for ${role.min_years}.`);
  }
  if(role.sector){
    const hits = (SECTORS[role.sector] || []).filter(k => lower.includes(k)).length;
    parts.push(['Sector', 10, hits >= 2 ? 1 : hits === 1 ? 0.5 : 0, hits ? `${hits} signals` : 'none']);
  }
  if(role.languages && role.languages.length){
    const have = role.languages.filter(l => new RegExp('(^|[^a-z])' + esc(l.toLowerCase()) + '($|[^a-z])').test(lower) || (cand && new RegExp(esc(l), 'i').test(cand.languages || '')));
    parts.push(['Languages', 10, have.length / role.languages.length, `${have.length}/${role.languages.length}`]);
    res.langMissing = role.languages.filter(l => !have.includes(l));
  }
  if(role.donors && role.donors.length){
    const have = role.donors.filter(dn => res.donors.includes(dn));
    parts.push(['Donor experience', 10, have.length / role.donors.length, `${have.length}/${role.donors.length}`]);
  }
  if(role.nice_to_have && role.nice_to_have.length){
    res.nice = role.nice_to_have.map(t => Object.assign({ term:t }, findTerm(text, lower, variants(t))));
    parts.push(['Nice-to-haves', 5, res.nice.filter(x => x.found).length / res.nice.length, `${res.nice.filter(x => x.found).length}/${res.nice.length}`]);
  }
  res.parts = parts.map(([label, weight, frac, detail]) => ({ label, weight, frac:Math.round(frac * 100) / 100, detail }));
  const W = parts.reduce((s, p) => s + p[1], 0);
  res.score = W ? Math.round(parts.reduce((s, p) => s + p[1] * p[2], 0) / W * 100) : null;
  return res;
}

/* ================= AI review (Anthropic API, called from this browser) ================= */
async function blobToB64(blob){ const buf = new Uint8Array(await blob.arrayBuffer()); let s = ''; for(let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return btoa(s); }
function parseJSON(t){ const a = t.indexOf('{'), b = t.lastIndexOf('}'); if(a < 0 || b < a) throw new Error('The AI reply was not in the expected format. Try again.'); return JSON.parse(t.slice(a, b + 1)); }
async function callClaude(body){
  const key = store.get('aiKey', '');
  if(!key) throw new Error('Add your Anthropic API key in Settings first.');
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{ 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' }, body:JSON.stringify(body) });
  } catch(e){ throw new Error('Could not reach the AI service. Check your internet connection.'); }
  if(!res.ok){
    let detail = ''; try { detail = (await res.json()).error.message; } catch(_) {}
    if(res.status === 401) throw new Error('The API key was rejected. Check it in Settings.');
    if(res.status === 429) throw new Error('Too many AI requests right now. Wait a minute and try again.');
    if(res.status === 529 || res.status === 503) throw new Error('The AI service is busy. Try again shortly.');
    throw new Error('AI request failed (' + res.status + '). ' + detail);
  }
  const data = await res.json();
  return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
}
async function aiReview(c, role){
  const model = store.get('aiModel', 'claude-sonnet-5-5');
  let text = null, pdf = null;
  try { text = await ensureCvText(c); }
  catch(e){ if(c.cv_path && extOf(c.cv_filename || c.cv_path) === 'pdf') pdf = await blobToB64(await db.fileBlob(c.cv_path)); else throw e; }
  const roleTxt = role ? [
    `Title: ${role.title}`, role.organization && `Client: ${role.organization}`, role.location && `Location: ${role.location}`, role.sector && `Sector: ${role.sector}`,
    role.min_years && `Minimum years of experience: ${role.min_years}`, role.must_have.length && `Must-haves: ${role.must_have.join('; ')}`,
    role.nice_to_have.length && `Nice-to-haves: ${role.nice_to_have.join('; ')}`, role.languages.length && `Languages: ${role.languages.join(', ')}`,
    role.donors.length && `Donor experience wanted: ${role.donors.join(', ')}`, role.summary && `Description: ${role.summary}`
  ].filter(Boolean).join('\n') : 'No specific role. Give a general assessment for international development and humanitarian roles.';
  const form = `Name: ${c.name}\nArea of expertise (self-reported): ${c.expertise || 'not given'}\nBased in: ${c.location || 'not given'}\nYears of experience (self-reported): ${c.years_experience || 'not given'}\nLanguages (self-reported): ${c.languages || 'not given'}${c.pool === 'consultant' ? `\nApplied to: consultant roster (short-term assignments)\nDay rate (self-reported): ${c.day_rate || 'not given'}\nAvailability: ${c.availability || 'not given'}\nAssignments: ${c.work_mode || 'not given'}` : ''}`;
  const system = 'You are an experienced recruiter for international development, humanitarian and NGO programs, including U.S. government-funded awards. ' +
    'You help a recruiter do a first-pass screen of a CV. Assess only job-relevant qualifications: experience, skills, sectors, donors, languages, education and certifications. ' +
    'Never consider or comment on age, gender, race, ethnicity, nationality, religion, marital or family status, disability, health, photos, or any other protected characteristic. ' +
    'Base every statement on what the CV actually says; write "not stated" when something is missing. Do not invent facts. The final decision is always made by a person. ' +
    'Reply with JSON only, no other text, in exactly this shape: ' +
    '{"summary": "2-3 sentence plain-English summary", "fit_score": 0-100 integer or null if no role, "fit_reasoning": "1-2 sentences", ' +
    '"years_experience_estimate": integer or null, "strengths": ["..."], "gaps_or_concerns": ["..."], "donor_experience": ["..."], ' +
    '"languages": ["..."], "interview_questions": ["3-5 specific questions to verify fit"]}';
  const userTxt = `ROLE\n${roleTxt}\n\nCANDIDATE FORM ANSWERS\n${form}\n\n` + (text ? `CV TEXT\n<cv>\n${text.slice(0, 60000)}\n</cv>` : 'The CV is attached as a PDF.');
  const content = pdf ? [{ type:'document', source:{ type:'base64', media_type:'application/pdf', data:pdf } }, { type:'text', text:userTxt }] : userTxt;
  const out = await callClaude({ model, max_tokens:4000, system, messages:[{ role:'user', content }] });
  return { model, at:new Date().toISOString(), role_title: role ? role.title : null, data: parseJSON(out) };
}

function visitsBlock(){
  const v = S.visits;
  if(!v) return `<div class="pipeline"><h2>website visitors</h2><div class="empty">Visitor counts appear here once the website is connected and the latest setup script has been run (README step 2).</div></div>`;
  const days = (v.daily || []).slice(-30), max = Math.max(1, ...days.map(x => +x.v || 0));
  const niceMax = max <= 10 ? 10 : Math.ceil(max / 10) * 10;
  const W = 960, H = 190, padL = 30, padB = 22, padT = 8, iw = W - padL, ih = H - padB - padT, bw = iw / Math.max(1, days.length);
  const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
  const bars = days.map((x, i) => {
    const val = +x.v || 0, hh = val ? Math.max(2, val / niceMax * ih) : 0, x0 = padL + i * bw + 1, w = Math.max(1, bw - 2), y = padT + ih - hh, r = Math.min(4, w / 2, hh);
    const path = hh ? `M${x0},${padT + ih} V${y + r} Q${x0},${y} ${x0 + r},${y} H${x0 + w - r} Q${x0 + w},${y} ${x0 + w},${y + r} V${padT + ih} Z` : '';
    return `<g class="vbar" data-tip="${h(fmt(x.d))}: ${val} visitor${val === 1 ? '' : 's'}"><rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${ih}" fill="transparent"></rect>${path ? `<path d="${path}" style="fill:var(--amber)"></path>` : ''}</g>`;
  }).join('');
  const axis = `<line x1="${padL}" x2="${W}" y1="${padT + ih}" y2="${padT + ih}" style="stroke:var(--line-2)"></line>
    <line x1="${padL}" x2="${W}" y1="${padT}" y2="${padT}" style="stroke:var(--line);stroke-dasharray:3 4"></line>
    <line x1="${padL}" x2="${W}" y1="${padT + ih / 2}" y2="${padT + ih / 2}" style="stroke:var(--line);stroke-dasharray:3 4"></line>
    <text x="${padL - 6}" y="${padT + 4}" text-anchor="end" class="ax">${niceMax}</text><text x="${padL - 6}" y="${padT + ih / 2 + 4}" text-anchor="end" class="ax">${niceMax / 2}</text><text x="${padL - 6}" y="${padT + ih + 4}" text-anchor="end" class="ax">0</text>
    ${days.length ? `<text x="${padL}" y="${H - 6}" class="ax">${h(fmt(days[0].d))}</text><text x="${W}" y="${H - 6}" text-anchor="end" class="ax">today</text>` : ''}`;
  const n = x => (+x || 0).toLocaleString('en-US');
  return `<div class="pipeline"><h2>website visitors · daily unique visitors, last 30 days</h2>
    <div class="vstats"><div><b>${n(v.visitors)}</b><span>unique visitors, all time</span></div><div><b>${n(v.last30)}</b><span>in the last 30 days</span></div><div><b>${n(v.today)}</b><span>today</span></div><div><b>${n(v.visits)}</b><span>total visits</span></div></div>
    <div class="vchart" id="vchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily unique website visitors over the last 30 days, peaking at ${max}">${axis}${bars}</svg><div class="vtip" id="vtip" hidden></div></div>
    <details class="vtable"><summary>Show as table</summary><div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>day</th><th>unique visitors</th></tr></thead><tbody>${days.slice().reverse().map(x => `<tr><td>${h(fmt(x.d))}</td><td class="num">${+x.v || 0}</td></tr>`).join('')}</tbody></table></div></details>
  </div>`;
}

function highlight(text, terms){
  let out = h(text.slice(0, 30000));
  const vs = [...new Set(terms.flatMap(t => variants(t)).map(v => v.trim()).filter(v => v.length > 2))].sort((a, b) => b.length - a.length);
  if(vs.length){ const re = new RegExp('(' + vs.map(v => esc(h(v))).join('|') + ')', 'gi'); out = out.replace(re, '<mark>$1</mark>'); }
  return out + (text.length > 30000 ? '\n\n…' : '');
}

const now = () => new Date().toISOString();
async function saveCand(c, patch, msg){ const row = await db.update('candidates', c.id, patch); put('cands', row); renderPanel(); renderMain(); if(msg) toast(msg); return row; }
async function saveReq(r, patch, msg){ const row = await db.update('talent_requests', r.id, patch); put('reqs', row); renderPanel(); renderMain(); if(msg) toast(msg); return row; }
function csvOut(name, rows, cols){
  const e = v => { v = v == null ? '' : Array.isArray(v) ? v.join('; ') : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const text = [cols.map(c => c[0]).join(',')].concat(rows.map(r => cols.map(c => e(c[1](r))).join(','))).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type:'text/csv;charset=utf-8' }));
  a.download = name + '-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('Exported ' + rows.length + ' rows.');
}
async function openFile(path){
  const url = await db.fileUrl(path);
  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
}
async function rankRole(role){
  const todo = S.cands.filter(c => !c.cv_text && c.cv_path);
  let i = 0, failed = 0;
  for(const c of todo){ i++; S.busy.rank = `Reading CV ${i} of ${todo.length}…`; renderPanel(); try { await ensureCvText(c); } catch(_) { failed++; } }
  S.rank[role.id] = S.cands.filter(c => c.cv_text).map(c => { const s = screen(c.cv_text, role, c); return { id:c.id, score:s.score == null ? 0 : s.score, missing:s.must.filter(m => !m.found).map(m => m.term) }; }).sort((a, b) => b.score - a.score);
  S.busy.rank = null; renderPanel();
  if(failed) toast(`${failed} CV${failed > 1 ? 's' : ''} couldn’t be read (scanned image or old .doc).`, true);
}

    const row = { title, organization:$('#rOrg').value.trim() || null, location:$('#rLoc').value.trim() || null, sector:$('#rSector').value || null, status:$('#rStatus').value,
      min_years: minv === '' ? null : Math.max(0, Math.min(50, parseInt(minv, 10) || 0)), must_have:list($('#rMust').value), nice_to_have:list($('#rNice').value), languages:list($('#rLangs').value),
      donors:Array.from(document.querySelectorAll('.rDonor:checked')).map(x => x.value), summary:$('#rSummary').value.trim() || null,
      employment_type:$('#rType').value || null, deadline:$('#rDeadline').value || null, details:$('#rDetails').value.trim() || null, apply_url:$('#rApply').value.trim() || null, is_public:$('#rPublic').checked, internal_notes:$('#rNotes').value.trim() || null };
    if(row.apply_url && !/^https:\/\/\S+$/i.test(row.apply_url)){ toast('The apply link must start with https://', true); $('#rApply').focus(); return; }
    if(!p.id && base.request_id) row.request_id = base.request_id;
    try {
      const saved = p.id ? await db.update('roles', p.id, row) : await db.insert('roles', row);
      put('roles', saved); S.panel = { type:'role', id:saved.id }; delete S.rank[saved.id]; renderPanel(); renderMain();
      const nm = saved.is_public && saved.status === 'open' && !isExpired(saved) && !saved.alert_sent_at ? alertMatches(saved).length : 0;
      toast((p.id ? 'Role saved.' : 'Role created.') + (nm ? ` ${nm} job-alert subscriber${nm === 1 ? ' matches' : 's match'} it. See “Job alerts” below.` : ''));
    } catch(e){ toast(errMsg(e), true); }
  },
  async 'lead-del'(el){ const id = el.dataset.id; if(S.ldDel !== id){ S.ldDel = id; renderMain(); return; } await db.remove('guide_leads', id); S.leads = S.leads.filter(x => x.id !== id); S.ldDel = null; renderMain(); toast('Lead deleted.'); },
  'export-leads'(){ csvOut('guide-leads', filteredLeads(), [['email', l => l.email], ['type', l => l.kind], ['wants_updates', l => l.updates], ['guide', l => l.guide], ['unlocked', l => l.created_at]]); },
  'af-area'(el){ S.af.area = el.dataset.v; renderMain(); },
  async 'alert-toggle'(el){ const a = S.alerts.find(x => x.id === el.dataset.id); if(!a) return; const saved = await db.update('job_alerts', a.id, { active:!a.active }); put('alerts', saved); renderMain(); toast(saved.active ? 'Subscriber reactivated.' : 'Unsubscribed.'); },
  async 'alert-del'(el){ const id = el.dataset.id; if(S.alDel !== id){ S.alDel = id; renderMain(); return; } await db.remove('job_alerts', id); S.alerts = S.alerts.filter(x => x.id !== id); S.alDel = null; renderMain(); toast('Subscriber deleted.'); },
  'export-alerts'(){ csvOut('job-alerts', filteredAlerts(), [['email', a => a.email], ['areas', a => (a.areas || []).join('; ')], ['region', a => a.region], ['active', a => a.active], ['signed_up', a => a.created_at]]); },
  async 'role-alert-mail'(){
    const r = roleById(S.panel.id); const to = alertPicked(r); if(!to.length){ toast('Tick at least one subscriber.', true); return; }
    const { subject, body } = alertMessage(r);
    const href = `mailto:?bcc=${to.map(encodeURIComponent).join(',')}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    if(href.length > 1900){ toast('Too many addresses for one email link. Use “Copy addresses” and “Copy message” and paste them into a new email.', true); return; }
    window.location.href = href;
    try { const saved = await db.update('roles', r.id, { alert_sent_at:new Date().toISOString() }); put('roles', saved); renderPanel(); } catch(_) {}
    toast(`Email opened for ${to.length} subscriber${to.length === 1 ? '' : 's'}. Check it and press send.`);
  },
  async 'role-alert-emails'(){ const r = roleById(S.panel.id); const to = alertPicked(r); try { await navigator.clipboard.writeText(to.join(', ')); toast(`${to.length} address${to.length === 1 ? '' : 'es'} copied. Paste them into BCC.`); } catch(_) { toast('Copy didn’t work here.', true); } },
  async 'role-alert-msg'(){ const r = roleById(S.panel.id); const { subject, body } = alertMessage(r); try { await navigator.clipboard.writeText('Subject: ' + subject + '\n\n' + body); toast('Message copied.'); } catch(_) { toast('Copy didn’t work here.', true); } },
  async 'role-rank'(){ const r = roleById(S.panel.id); if(r) await rankRole(r); },
  'role-del'(){ S.panel.confirm = true; renderPanel(); }, 'role-del-no'(){ S.panel.confirm = false; renderPanel(); },
  async 'role-del-yes'(){ const id = S.panel.id; try { await db.remove('roles', id); S.roles = S.roles.filter(x => x.id !== id); S.cands.forEach(c => { if(c.role_id === id) c.role_id = null; }); closePanel(); renderMain(); toast('Role deleted.'); } catch(e){ toast(errMsg(e), true); } },
  async 'newcand-save'(){
    const name = $('#nName').value.trim(), email = $('#nEmail').value.trim(), file = $('#nFile').files[0];
    const msg = t => { $('#nMsg').innerHTML = `<div class="msg err">${h(t)}</div>`; };
    if(!name || !/^\S+@\S+\.\S+$/.test(email)) return msg('Add a name and a valid email.');
    if(file && file.size > 10 * 1024 * 1024) return msg('That file is over 10 MB.');
    if(file && !MIME[extOf(file.name)]) return msg('Use a PDF, Word or text file.');
    const btn = document.querySelector('[data-act="newcand-save"]'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const path = file ? await db.upload('cvs', file) : null;
      const row = await db.insert('candidates', { name, email, phone:$('#nPhone').value.trim() || null, location:$('#nLoc').value.trim() || null, expertise:$('#nExp').value || null,
        years_experience:$('#nYears').value || null, languages:$('#nLangs').value.trim() || null, role_id:$('#nRole').value || null, cv_path:path,
        ...($('#nPool').value === 'consultant' ? { pool:'consultant', day_rate:$('#nRate').value.trim() || null, availability:$('#nAvail').value || null, work_mode:$('#nMode').value || null } : { pool:'network' }), cv_filename:file ? file.name : null,
        consent:$('#nConsent').checked, source:'admin', history:[{ at:now(), text:'Added by you' }] });
      put('cands', row); markSeen(row.id); openPanel('cand', row.id); toast('Candidate added.');
    } catch(e){ msg(errMsg(e)); btn.disabled = false; btn.textContent = 'Add candidate'; }
  },
  'ai-save'(){ store.set('aiKey', $('#aiKey').value.trim()); store.set('aiModel', $('#aiModel').value); $('#aiMsg').innerHTML = '<div class="msg ok">Saved in this browser.</div>'; },
  'ai-clear'(){ store.set('aiKey', ''); $('#aiKey').value = ''; $('#aiMsg').innerHTML = '<div class="msg">Key removed from this browser.</div>'; },
  async 'ai-test'(el){
    ACT['ai-save'](); el.disabled = true; $('#aiMsg').innerHTML = '<div class="msg"><span class="spinner"></span> Testing…</div>';
    try { const t = await callClaude({ model:store.get('aiModel', 'claude-sonnet-5-5'), max_tokens:200, messages:[{ role:'user', content:'Reply with the single word: ready' }] }); $('#aiMsg').innerHTML = `<div class="msg ok">Connected. The AI replied: “${h(t.trim().slice(0, 40))}”.</div>`; }
    catch(e){ $('#aiMsg').innerHTML = `<div class="msg err">${h(errMsg(e))}</div>`; }
    finally { el.disabled = false; }
  },
  async 'change-pw'(){ const v = $('#chPw').value; if(v.length < 8){ toast('Use at least 8 characters.', true); return; } try { await db.setPassword(v); $('#chPw').value = ''; toast('Password changed.'); } catch(e){ toast(errMsg(e), true); } },
  'export-cands'(){ csvOut('candidates', filteredCands().length && S.view === 'candidates' ? filteredCands() : S.cands, [
    ['name', c => c.name], ['email', c => c.email], ['phone', c => c.phone], ['expertise', c => c.expertise], ['location', c => c.location], ['years_experience', c => c.years_experience],
    ['languages', c => c.languages], ['pool', c => c.pool || 'network'], ['day_rate', c => c.day_rate], ['availability', c => c.availability], ['work_mode', c => c.work_mode], ['applied_for', c => roleById(c.role_id) ? roleById(c.role_id).title : ''], ['status', c => c.status], ['rating', c => c.rating],
    ['score', c => c.screening && c.screening.score], ['scored_against', c => c.screening && c.screening.role_title], ['ai_fit_score', c => c.ai_review && c.ai_review.data && c.ai_review.data.fit_score],
    ['notes', c => c.notes], ['source', c => c.source], ['received', c => c.created_at]]); },
  'export-reqs'(){ csvOut('requests', S.reqs, [['organization', r => r.organization], ['type', r => r.kind], ['role_needed', r => r.role_needed], ['funding', r => r.funding_source], ['urgency', r => r.urgency],
    ['contact', r => r.contact_name], ['email', r => r.email], ['phone', r => r.phone], ['preferred_time', r => r.preferred_time], ['message', r => r.message], ['status', r => r.status], ['your_notes', r => r.admin_notes], ['received', r => r.created_at]]); },
  'export-roles'(){ csvOut('roles', S.roles, [['title', r => r.title], ['client', r => r.organization], ['location', r => r.location], ['sector', r => r.sector], ['status', r => r.status], ['listed', r => r.is_public], ['job_type', r => r.employment_type], ['deadline', r => r.deadline], ['apply_url', r => r.apply_url],
    ['min_years', r => r.min_years], ['must_have', r => r.must_have], ['nice_to_have', r => r.nice_to_have], ['languages', r => r.languages], ['donors', r => r.donors], ['created', r => r.created_at]]); }
};
const cur = () => S.cands.find(x => x.id === S.panel.id);
const curReq = () => S.reqs.find(x => x.id === S.panel.id);

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  if(el.tagName === 'A' && el.dataset.act !== 'filter-new-cands') e.preventDefault();
  try { await fn(el, e); } catch(err){ toast(errMsg(err), true); }
});
$('#scrim').addEventListener('click', closePanel);
document.addEventListener('mousemove', e => {
  const tip = $('#vtip'); if(!tip) return;
  const g = e.target.closest && e.target.closest('.vbar');
  if(!g){ tip.hidden = true; return; }
  const box = $('#vchart').getBoundingClientRect();
  tip.textContent = g.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(box.width - 60, Math.max(60, e.clientX - box.left)) + 'px'; tip.style.top = (e.clientY - box.top - 10) + 'px';
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.panel) closePanel(); });
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input; if(!k) return;
  const pos = e.target.selectionStart;
  if(k === 'cq') S.cf.q = e.target.value; if(k === 'rq') S.rf.q = e.target.value; if(k === 'aq') S.af.q = e.target.value; if(k === 'lq') S.lf.q = e.target.value;
  renderMain(); const inp = $('#' + k); if(inp){ inp.focus(); try { inp.setSelectionRange(pos, pos); } catch(_) {} }
});
document.addEventListener('change', async e => {
  const k = e.target.dataset && e.target.dataset.change; if(!k) return;
  try {
    if(k === 'crole'){ S.cf.role = e.target.value; renderMain(); }
    else if(k === 'lkind'){ S.lf.kind = e.target.value; renderMain(); }
    else if(k === 'astatus'){ S.af.status = e.target.value; renderMain(); }
    else if(k === 'npool'){ $('#nRoster').hidden = e.target.value !== 'consultant'; }
    else if(k === 'cpool'){ S.cf.pool = e.target.value; renderMain(); }
    else if(k === 'csort'){ S.cf.sort = e.target.value; renderMain(); }
    else if(k === 'cand-status'){ const c = cur(), v = e.target.value, from = (CAND_STATUS.find(s => s[0] === c.status) || [])[1], to = (CAND_STATUS.find(s => s[0] === v) || [])[1];
      await saveCand(c, { status:v, history:(c.history || []).concat([{ at:now(), text:`Status: ${from} → ${to}` }]) }, 'Status updated.'); }
    else if(k === 'cand-manual'){ const c = cur(); const sc = Object.assign({}, c.screening || {});
      sc.manual = Object.assign({}, sc.manual || {}, { [e.target.dataset.k]:e.target.checked }); await saveCand(c, { screening:sc }); }
    else if(k === 'req-status'){ const r = curReq(), v = e.target.value, from = (REQ_STATUS.find(s => s[0] === r.status) || [])[1], to = (REQ_STATUS.find(s => s[0] === v) || [])[1];
      await saveReq(r, { status:v, history:(r.history || []).concat([{ at:now(), text:`Status: ${from} → ${to}` }]) }, 'Status updated.'); }
  } catch(err){ toast(errMsg(err), true); }
});
document.addEventListener('focusout', async e => {
  if(e.target.id === 'candNotes'){ const c = cur(); if(c && e.target.value !== (c.notes || '')){ try { const row = await db.update('candidates', c.id, { notes:e.target.value }); put('cands', row); toast('Notes saved.'); } catch(err){ toast(errMsg(err), true); } } }
  if(e.target.id === 'reqNotes'){ const r = curReq(); if(r && e.target.value !== (r.admin_notes || '')){ try { const row = await db.update('talent_requests', r.id, { admin_notes:e.target.value }); put('reqs', row); toast('Notes saved.'); } catch(err){ toast(errMsg(err), true); } } }
});

/* ================= start ================= */
(async function boot(){
  if(db.demo){ S.user = await db.session(); return enter(); }
  db.onRecovery(() => showLogin('recovery'));
  if(/type=recovery/.test(location.hash)) return; // the recovery event will show the form
  const u = await db.session().catch(() => null);
  if(u){ S.user = u; enter(); } else showLogin();
})();
})();
</script>

</body></html>
